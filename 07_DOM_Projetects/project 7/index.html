<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Birth Chart Form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="astrology-container">
        <div class="header-section">
            <h1>✨ Discover Your Destiny ✨</h1>
            <p>Enter your birth details to unlock your cosmic blueprint.</p>
        </div>

        <form action="#" method="POST" class="astro-form">
            
            <!-- Name & Surname -->
            <div class="input-group">
                <div class="input-field">
                    <label for="name">First Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. John" required>
                </div>
                <div class="input-field">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" name="surname" placeholder="e.g. Doe" required>
                </div>
            </div>

            <!-- Date of Birth Section (Simple Text Inputs) -->
            <label class="section-label">Date of Birth</label>
            <div class="dob-group">
                <!-- Day -->
                <div class="input-field">
                    <label for="day">Day</label>
                    <input type="text" id="day" name="day" placeholder="DD (e.g. 15)" maxlength="2" required>
                </div>

                <!-- Month -->
                <div class="input-field">
                    <label for="month">Month</label>
                    <input type="text" id="month" name="month" placeholder="MM (e.g. 08)" maxlength="2" required>
                </div>

                <!-- Year -->
                <div class="input-field">
                    <label for="year">Year</label>
                    <input type="text" id="year" name="year" placeholder="YYYY (e.g. 1998)" maxlength="4" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Reveal My Horoscope</button>

           

        </form>
         <div id="folafol"></div>
    </div>
   <script src="index.js"></script>
</body>
</html>
